[workspace]
members = ["crates/tfm-core", "crates/tfm-app"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Proprietary"
authors = ["TFM Usinagem & Manutenção Industrial LTDA"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
chrono = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
