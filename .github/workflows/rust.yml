name: Rust

on:
  push:
    branches: [main, rust-egui]
  pull_request:
    branches: [main, rust-egui]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Testes e build release (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --workspace

      - name: Build release
        run: cargo build -p tfm-app --release

      - name: Publicar TFM_GCODE.exe
        uses: actions/upload-artifact@v4
        with:
          name: TFM_GCODE-windows
          path: target/release/TFM_GCODE.exe
          if-no-files-found: error
